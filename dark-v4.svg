<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Professional profile of Akshaya Kakinada, an AI and machine learning engineering student and full-stack builder, in a dark cyber-pink terminal interface.">
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1180" y2="610" gradientUnits="userSpaceOnUse">
    <stop stop-color="#030208"/><stop offset="1" stop-color="#10051C"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FF2BD6"><animate attributeName="stop-color" values="#FF2BD6;#FF3CAC;#9D4EDD;#FF2BD6" dur="9s" repeatCount="indefinite"/></stop>
    <stop offset=".55" stop-color="#9D4EDD"><animate attributeName="stop-color" values="#9D4EDD;#22D3EE;#FF2BD6;#9D4EDD" dur="9s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="portraitGradient" x1="55" y1="100" x2="410" y2="450" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FF2BD6"><animate attributeName="stop-color" values="#FF2BD6;#FF3CAC;#FF2BD6" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset=".62" stop-color="#9D4EDD"/><stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <radialGradient id="orb"><stop stop-color="#FF2BD6" stop-opacity=".22"/><stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FF2BD6" stroke-opacity=".055"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12" result="b"/><feColorMatrix in="b" values="1 0 0 0 0.15 0 0.2 0 0 0 0 0.7 0 0.2 0 0 0 .22 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="frame"><rect width="1180" height="610" rx="24"/></clipPath>
  <clipPath id="portraitClip"><rect x="44" y="88" width="382" height="372" rx="18"/></clipPath>
  <style>
