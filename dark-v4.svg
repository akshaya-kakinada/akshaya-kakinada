    .value { font-size: 13px; font-weight: 600; }
    .ascii { font-size: 7.2px; font-weight: 700; white-space: pre; }
    .project { font-size: 12px; font-weight: 700; }
    .desc { font-size: 10.5px; }
  </style>
</defs>
